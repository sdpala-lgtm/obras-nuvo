<style>
:root{--ac:#e8a21c;--acd:#b97d0a;--bg:#f4f1ea;--card:#fffdf9;--ink:#15202b;--mut:#6b7684;--line:#e4dfd3;--side:#14202b;--ok:#13a56a;--bad:#d6334f;--info:#1f8fd1;--soft:#f0ece2;--r:16px}
body.dark{--bg:#0f161d;--card:#18222d;--ink:#e9eef4;--mut:#93a1b1;--line:#263341;--soft:#1f2b38;--side:#0a1016}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;height:100vh}
aside{width:232px;background:var(--side);color:#d6dde5;display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0;overflow:auto}
.wsw{display:flex;gap:4px;margin:0 0 12px}.wsw button{flex:1;border:1px solid #ffffff22;background:transparent;color:#c5d0db;border-radius:8px;padding:7px 4px;font-size:11px;cursor:pointer}.wsw button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid #ffffff14;margin-bottom:12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ac);color:#14202b;display:grid;place-items:center;font-weight:700;flex-shrink:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:13px;letter-spacing:.06em;color:#fff}.brand small{color:#8fa0b2;font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button,.foot button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center}
.nav button:hover,.foot button:hover{background:#ffffff10}
.nav button.on{background:var(--ac);color:#14202b;font-weight:600}
.foot{border-top:1px solid #ffffff14;padding-top:10px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;gap:10px;align-items:center;padding:10px 8px;font-size:12px}
.me .av{width:30px;height:30px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;font-size:11px;font-weight:600}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.sbox{position:relative;flex:1;max-width:520px}
.sbox input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.sres{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px #0003;z-index:30;max-height:360px;overflow:auto}
.sres div{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}.sres div:hover{background:var(--soft)}.sres small{color:var(--mut)}
.tb{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;position:relative}
.tb.on{background:#e8a21c26;border-color:var(--ac)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--ac);color:#14202b;border-radius:10px;font-size:11px;font-weight:700;padding:0 6px}
.content{flex:1;overflow:auto;padding:22px 24px 60px}
h1{font-size:28px;margin:0 0 2px}h2{font-size:15px;margin:0}h3{font-size:13px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.sub{color:var(--mut);margin:0 0 16px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);color:#14202b;border-color:var(--ac);font-weight:600}
.btn.d{color:var(--bad);border-color:#d6334f55}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.s{padding:5px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}aside{width:70px}aside .t,.brand div,.me div{display:none}}
.kpi{text-align:left;cursor:pointer}.kpi p{margin:0}.kpi .n{font-size:26px;font-weight:600;margin:4px 0}.kpi .l{color:var(--mut);font-size:12px}
.hero{border-radius:var(--r);padding:22px;color:#fff;background:linear-gradient(120deg,#14202b,#2a3b4d);background-size:cover;background-position:center;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;min-height:130px;position:relative;overflow:hidden}
.hero small{opacity:.85}.hero h2{font-size:24px;color:#fff;margin-top:4px}
.hero .acts{display:flex;gap:8px}.hero .btn{background:#ffffff22;color:#fff;border-color:#ffffff44}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.ok{background:#13a56a22;color:var(--ok)}.pill.bad{background:#d6334f22;color:var(--bad)}.pill.warn{background:#e8a21c26;color:var(--acd)}.pill.info{background:#1f8fd122;color:var(--info)}.pill.pu{background:#7a4fd122;color:#7a4fd1}

.tools input,.tools select,.f input,.f select,.f textarea,textarea.n{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tools input{flex:1;min-width:200px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--soft);border:1px solid transparent;border-radius:10px;padding:8px 14px}.tab.on{background:var(--ac);color:#14202b;font-weight:600}
.kan{display:flex;gap:12px;overflow:auto;padding-bottom:10px;align-items:flex-start}
.col{min-width:270px;width:270px;background:var(--soft);border-radius:var(--r);padding:12px;flex-shrink:0}
.col h3{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--ink)}

.mut{color:var(--mut)}.sm{font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--acd)}
.bars{display:flex;gap:26px;align-items:flex-end;height:150px;padding:8px 10px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.bar i{display:block;width:100%;max-width:70px;border-radius:8px 8px 0 0;min-height:3px}.bar span{font-size:11px;color:var(--mut);margin-bottom:3px}

.split{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:10px 0}

const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const fd=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

/* ============ Datos ============ */
const KEY='workspaces_v2';
const SEED=JSON.parse($('#seed').textContent);
function load(){
  let loc=null;try{loc=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  const pick=(x,y)=>(x&&(x.savedAt||0)>=((y&&y.savedAt)||0))?x:(y||null);
  return JSON.parse(JSON.stringify({nuvo:pick(loc&&loc.nuvo,SEED.nuvo),arq:pick(loc&&loc.arq,SEED.arq)}));
}
const W=load();let AW='nuvo',CK=null,D=W.nuvo;
/* --- Cifrado del espacio Arq. Paladino (AES-GCM + PBKDF2) --- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encD(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},CK.key,new TextEncoder().encode(JSON.stringify(D)));return {salt:b64(CK.salt),iv:b64(iv),ct:b64(new Uint8Array(ct)),savedAt:D.savedAt||Date.now()}}
async function decBlob(blob,pw){const salt=ub64(blob.salt),key=await deriveKey(pw,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(blob.iv)},key,ub64(blob.ct));return {data:JSON.parse(new TextDecoder().decode(pt)),ck:{key,salt}}}
let saveT=null;
async function flush(){
  try{if(AW==='nuvo')W.nuvo=D;else if(CK)W.arq=await encD();
  localStorage.setItem(KEY,JSON.stringify(W))}catch(e){}
}
function persist(){D.savedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(flush,200);scheduleSync()}

}
function resetUI(){U.view='dashboard';U.sub={};U.q={};U.cur='';U.sel=null}
function arqGate(msg){
  const nuevo=!W.arq;
  modal(`<h2>🔒 Arq. Paladino</h2><p class="sm mut">${nuevo?'Espacio privado para tus obras particulares, fuera de Nuvó. Creá una contraseña: los datos se guardan cifrados y nadie más puede leerlos, ni Tomás. <b>Si la olvidás, no se pueden recuperar.</b>':'Ingresá tu contraseña para abrir tus obras particulares.'}</p>${msg?`<p style="color:#b3261e" class="sm">${msg}</p>`:''}<div class="fg"><label>Contraseña</label><input type="password" id="pw1" autocomplete="off"></div>${nuevo?'<div class="fg"><label>Repetir contraseña</label><input type="password" id="pw2" autocomplete="off"></div>':''}<div class="acts"><button class="btn" data-a="close">Cancelar</button><button class="btn p" data-a="arqgo">${nuevo?'Crear y entrar':'Entrar'}</button></div>`);
  setTimeout(()=>{const i=$('#pw1');if(i)i.focus()},50);
}
async function arqGo(){
  const pw=($('#pw1')||{}).value||'';
  try{
    if(!W.arq){
      const p2=($('#pw2')||{}).value;
      if(pw.length<8){arqGate('Usá al menos 8 caracteres.');return}
      if(pw!==p2){arqGate('Las contraseñas no coinciden.');return}
      const salt=crypto.getRandomValues(new Uint8Array(16));CK={key:await deriveKey(pw,salt),salt};
      D=JSON.parse(JSON.stringify(SEED.arqInit));D.savedAt=Date.now();AW='arq';await flush();
    }else{
      const r=await decBlob(W.arq,pw);CK=r.ck;D=r.data;AW='arq';
    }
    resetUI();closeModal();render();
  }catch(e){CK=null;if(!W.arq){arqGate('No se pudo crear (el navegador no permite cifrado en esta vista).');}else arqGate('Contraseña incorrecta.')}
}

function gantt(rows){
  const sc=U.gantt,days={semana:14,mes:60,trimestre:120,semestre:200,anio:400}[sc],start=addDays(today(),-Math.round(days*0.4)),W=1000,px=W/days;
  const x=d=>Math.max(0,Math.min(W,dayDiff(start,d)*px));
  let ticks='';const step=Math.max(1,Math.round(days/10));for(let i=0;i<days;i+=step){const d=addDays(start,i);ticks+=`<span style="left:${i*px}px">${+d.slice(8)}/${d.slice(5,7)}</span>`}
  return `<div class="card"><div class="row" style="margin-bottom:12px"><h2>Cronograma</h2><div class="tabs" style="margin:0">${['semana','mes','trimestre','semestre','anio'].map(k=>`<button class="tab ${sc===k?'on':''}" data-a="gscale" data-v="${k}">${k==='anio'?'Año':k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div>
  <div class="gantt"><div style="width:${W+20}px;position:relative"><div class="gh">${ticks}</div><div class="today" style="left:${x(today())}px"></div>
  ${rows.map(p=>{const a=x(p.inicio||today()),b=Math.max(a+60,x(p.entrega||today()));const pr=p.estado==='Finalizado'?100:Math.round((p.etapa+1)/S().etapas.length*100);const dd=p.entrega?dayDiff(today(),p.entrega):0;return `<div class="gr"><div class="gb" style="left:${a}px;width:${b-a}px" data-a="open" data-c="proyectos" data-id="${p.id}"><i style="width:${pr}%"></i><span>${esc(p.nombre)}</span><span class="mut sm">${pr}%</span></div><small class="${dd<0&&p.estado!=='Finalizado'?'bad-t':'mut'}" style="position:absolute;left:${b+8}px;white-space:nowrap">${p.estado==='Finalizado'?'Entrega completada':dd<0?'Atrasado '+(-dd)+' d':dd+' días restantes'}</small></div>`}).join('')}</div></div></div>`;
}

function vAgenda(){
  const {y,m}=U.cal,mode=U.cal.mode,flt=U.sub.flt||'todo';
  const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));

  }else{

  }

function fileToData(file,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(file)})}

function toCSV(c){const f=SCH[c].f;const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return [f.map(x=>q(x[1])).join(',')].concat(live(c).map(r=>f.map(x=>q(r[x[0]])).join(','))).join('\n')}
function parseCSV(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){v+='"';i++}else q=false}else v+=ch}else if(ch==='"')q=true;else if(ch===','||ch===';'){r.push(v);v=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=ch}if(v||r.length){r.push(v);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}
async function save(name,data,mime){

/* ============ Sincronización con Google Sheet (solo app instalada) ============ */
const STANDALONE=!window.claude;
const SYNC_C=['clientes','proyectos','tareas','visitas','proveedores','compras','documentos','movimientos','equipo'];
const LOCAL_ONLY=['logo','portada','foto'];
const SYN={cfg:{},st:{since:0,h:{},arqUp:0},msg:'',busy:false,t:null};
try{SYN.cfg=JSON.parse(localStorage.getItem('sync_cfg')||'{}');const _s=JSON.parse(localStorage.getItem('sync_st')||'null');if(_s)SYN.st=_s}catch(e){}
const saveSyn=()=>{try{localStorage.setItem('sync_cfg',JSON.stringify(SYN.cfg));localStorage.setItem('sync_st',JSON.stringify(SYN.st))}catch(e){}};
const strip=o=>{const c={};for(const k in o)if(k!=='upd'&&!LOCAL_ONLY.includes(k))c[k]=o[k];return c};
const hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h)+':'+t.length};
const metaOf=N=>({settings:strip(N.settings),notas:N.notas||'',reminders:!!N.reminders});
function syncFlat(N,c,r){
  const o={};
  if(c==='meta'){o['Estudio']=N.settings.estudio;o['Notas']=N.notas||'';return o}
  const nmN=(cc,id)=>{const x=(N[cc]||[]).find(y=>y.id===id);return x?(x.nombre||x.titulo||''):''};
  SCH[c].f.forEach(([k,l,t,x])=>{let v=r[k];if(t==='ref')v=nmN(x,v);else if(t==='etapa')v=(N.settings.etapas[v]||'');o[l]=(v==null?'':v)});
  o['Eliminado']=r.del?'sí':'';return o;
}
const syncCols=()=>{const o={meta:['Estudio','Notas']};SYNC_C.forEach(c=>o[c]=SCH[c].f.map(f=>f[1]).concat(['Eliminado']));return o};
function collectChanges(N){
  const ch=[],h=SYN.st.h,seen={},now=Date.now(),sent={};
  const hasData=['clientes','proyectos','movimientos'].some(c=>(N[c]||[]).length);
  if(SYN.st.since===0&&!hasData)return {ch:[],sent:{}};
  const mk=(c,id,obj,setUpd)=>{
    const key=c+'|'+id;seen[key]=1;const d=strip(obj),js=hsh(JSON.stringify(d));
    if(h[key]===js)return;
    const upd=now;setUpd(upd);ch.push({c,id,upd,data:d,flat:syncFlat(N,c,obj)});sent[key]=js;
  };
  mk('meta','meta',metaOf(N),u=>{N.metaUpd=u});
  SYNC_C.forEach(c=>(N[c]||[]).forEach(r=>mk(c,r.id,r,u=>{r.upd=u})));
  Object.keys(h).forEach(key=>{if(!seen[key]&&key.indexOf('meta|')!==0){const [c,id]=key.split('|');ch.push({c,id,upd:now,data:null,flat:{}});sent[key]=null}});
  return {ch,sent};
}
function applyRemote(N,recs){
  let n=0;const h=SYN.st.h;
  recs.forEach(r=>{
    const key=r.c+'|'+r.id;
    if(r.c==='meta'){if(!r.data)return;const keep={};LOCAL_ONLY.forEach(k=>{if(N.settings[k])keep[k]=N.settings[k]});N.settings=Object.assign({},r.data.settings,keep);N.notas=r.data.notas;N.reminders=r.data.reminders;N.metaUpd=r.upd;h[key]=hsh(JSON.stringify(strip(metaOf(N))));n++;return}
    const arr=N[r.c];if(!arr)return;const i=arr.findIndex(x=>x.id===r.id);
    if(r.data==null){if(i>=0){arr.splice(i,1);n++}delete h[key];return}
    const keep={};if(i>=0)LOCAL_ONLY.forEach(k=>{if(arr[i][k])keep[k]=arr[i][k]});
    const rec=Object.assign({},r.data,keep,{upd:r.upd});
    if(i>=0){if(hsh(JSON.stringify(strip(arr[i])))===h[key]||(arr[i].upd||0)<=r.upd){arr[i]=rec;n++}}else{arr.push(rec);n++}
    h[key]=hsh(JSON.stringify(strip(r.data)));
  });
  return n;
}
function setSynMsg(m){SYN.msg=m;const b=document.querySelector('[data-a=syncnow]');if(b)b.textContent='☁ '+m}
async function syncNow(manual){
  if(!STANDALONE||SYN.busy)return;
  const c=SYN.cfg;if(!c.url||!c.token){if(manual)toast('Primero cargá la dirección y la clave de sincronización');return}
  if(!navigator.onLine){setSynMsg('Sin conexión · pendiente');return}
  SYN.busy=true;setSynMsg('Sincronizando…');
  try{
    const N=W.nuvo,{ch,sent}=collectChanges(N);
    const arqUp=W.arq&&(W.arq.savedAt||0)>(SYN.st.arqUp||0)?W.arq.savedAt:0;
    const body={token:c.token,since:SYN.st.since,changes:ch,cols:syncCols(),arq:arqUp?{upd:arqUp,data:JSON.stringify(W.arq)}:null,arqSince:Math.max(SYN.st.arqUp||0,arqUp)};
    const r=await fetch(c.url,{method:'POST',body:JSON.stringify(body),redirect:'follow'});
    const res=await r.json();if(res.error)throw new Error(res.error);
    Object.keys(sent).forEach(k=>{if(sent[k]===null)delete SYN.st.h[k];else SYN.st.h[k]=sent[k]});
    const n=applyRemote(N,res.records||[]);
    if(arqUp)SYN.st.arqUp=arqUp;
    let gotArq=false;if(res.arq&&AW!=='arq'){W.arq=JSON.parse(res.arq.data);SYN.st.arqUp=res.arq.upd;gotArq=true}
    SYN.st.since=res.sv;saveSyn();
    if(n||gotArq)await flush();
    const hh=new Date();setSynMsg('Sincronizado '+pad(hh.getHours())+':'+pad(hh.getMinutes()));
    if(manual)toast('Sincronizado ✔');
    if(n&&!$('#layer').innerHTML)render();
  }catch(e){setSynMsg('Error de sincronización');if(manual)toast('No se pudo sincronizar: '+(e&&e.message||e))}
  SYN.busy=false;
}
function scheduleSync(){if(!STANDALONE||!SYN.cfg.url)return;clearTimeout(SYN.t);SYN.t=setTimeout(()=>syncNow(false),4000)}
if(STANDALONE){
  try{const m=/[#&]sync=([^&]+)/.exec(location.hash||'');if(m){const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(o&&o.url&&o.token){SYN.cfg={url:o.url,token:o.token};saveSyn()}history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
  addEventListener('online',()=>syncNow(false));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow(false)});
  setInterval(()=>syncNow(false),180000);setTimeout(()=>syncNow(false),1500);
}

 dayclick:e=>{const l=dayEvents(e.d);modal(`<h2>${fd(e.d)}</h2>${l.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(x.txt)}<br><small class="mut">${esc(x.sub)}</small></span><span class="pill">${x.tag}</span></div>`).join('')||'<p class="mut">Sin eventos.</p>'}<div class="acts"><button class="btn" data-a="close">Cerrar</button><button class="btn" data-a="newtaskd" data-d="${e.d}">+ Tarea</button><button class="btn p" data-a="newvisd" data-d="${e.d}">+ Agendar visita</button></div>`)},
 newvisd:e=>openForm('visitas',null,{fecha:e.d}),newtaskd:e=>openForm('tareas',null,{vence:e.d}),
 sres:e=>{$('#sr').innerHTML='';const t=e.t;if(t==='opencli')A.opencli(e);else if(t==='open')A.open(e);else openForm(e.c,e.id)},
 mention:e=>{const t=$('#cm');t.value+=(t.value&&!t.value.endsWith(' ')?' ':'')+'@'+e.n+' ';t.focus()},
 comment:e=>{const t=$('#cm').value.trim();if(!t)return;const p=byId('proyectos',e.id);(p.comentarios=p.comentarios||[]).push({autor:S().titular,fecha:today(),txt:t});persist();render()},
 cover:e=>pickImage(1400,d=>{byId('proyectos',e.id).portada=d;persist();render()}),
 photo:e=>pickImage(240,d=>{byId('equipo',e.id).foto=d;persist();render()}),
 report:e=>{const p=byId('proyectos',e.id),E=S().etapas,tk=live('tareas').filter(t=>t.proyectoId===e.id),vs=live('visitas').filter(v=>v.proyectoId===e.id).slice(0,5),dc=live('documentos').filter(d=>d.proyectoId===e.id);
   const txt=`REPORTE DE AVANCE — ${p.nombre} (${p.codigo})\n${S().estudio} · ${fd(today())}\n\nCliente: ${nm('clientes',p.clienteId)}\nEtapa actual: ${E[p.etapa]} (${p.etapa+1} de ${E.length})\nEstado: ${p.estado}\nEntrega prevista: ${fd(p.entrega)}\n\nTareas completadas: ${tk.filter(t=>t.estado==='Completada').length} de ${tk.length}\nPróximas tareas:\n${tk.filter(t=>t.estado!=='Completada').map(t=>' • '+t.titulo+' (vence '+fd(t.vence)+')').join('\n')||' • —'}\n\nÚltimas visitas:\n${vs.map(v=>' • '+fd(v.fecha)+' — '+v.titulo).join('\n')||' • —'}\n\nDocumentación:\n${dc.map(d=>' • '+d.titulo+' — '+d.estado).join('\n')||' • —'}\n\n${S().titular}${S().matricula?' · '+S().matricula:''}`;
   modal(`<h2>Reporte para el cliente</h2><textarea class="n" id="cp" style="min-height:360px">${esc(txt)}</textarea><div class="acts"><button class="btn" data-a="close">Cerrar</button><button class="btn p" data-a="copy">Copiar texto</button></div>`,1)},
 copy:()=>{const t=$('#cp');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copiado ✔'),()=>toast('Seleccioná y copiá manualmente'))}catch(e){toast('Seleccioná y copiá manualmente')}},
 import:e=>openImport(e.c),doimport:e=>doImport(e.c),
 export:e=>save(e.c+'.csv','\ufeff'+toCSV(e.c),'text/csv'),
 backup:()=>save('backup-estudio.json',JSON.stringify(D,null,1),'application/json'),
 restorebk:()=>modal(`<h2>Restaurar copia</h2><p class="sm mut">Pegá el contenido de un archivo de copia (JSON). Reemplaza los datos actuales.</p><textarea class="n" id="rb" style="min-height:200px"></textarea><div class="acts"><button class="btn" data-a="close">Cancelar</button><button class="btn p" data-a="dorestore">Restaurar</button></div>`),
 dorestore:()=>{try{const o=JSON.parse($('#rb').value);if(!o.settings)throw 0;D=o;persist();closeModal();toast('Copia restaurada ✔');render()}catch(e){toast('El contenido no es una copia válida')}},
 rall:e=>{U.sub.rall=!U.sub.rall;render()},repcopy:()=>{const x=repText(repData());modal(`<h2>Reporte</h2><textarea class="n" id="cp" style="min-height:360px">${esc(x)}</textarea><div class="acts"><button class="btn" data-a="close">Cerrar</button><button class="btn p" data-a="copy">Copiar</button></div>`)},repdl:()=>save('reporte-obras-'+today()+'.txt',repText(repData()),'text/plain'), syncnow:()=>syncNow(true),syncsave:()=>{SYN.cfg={url:$('#sy_url').value.trim(),token:$('#sy_tok').value.trim()};saveSyn();closeModal();render();syncNow(true)}, publish:publishCloud,ws:e=>switchWS(e.w),arqgo:arqGo,lock:lockArq,chpw:changePw,dochpw:doChangePw,
 wipe:()=>modal(`<h2>¿Vaciar datos de ejemplo?</h2><p>Se borran solo los registros de ejemplo. Tus obras reales (como La Botera), los ajustes y el equipo se conservan.</p><div class="acts"><button class="btn" data-a="close">Cancelar</button><button class="btn d" data-a="dowipe">Vaciar todo</button></div>`),
 dowipe:()=>{['clientes','proyectos','tareas','visitas','proveedores','compras','documentos','movimientos'].forEach(c=>D[c]=D[c].filter(x=>!x.ej));D.notas='';persist();closeModal();toast('Datos vaciados');render()}
};
function pickImage(max,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){const d=await fileToData(i.files[0],max);if(d)cb(d)}};i.click()}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='q'||a==='pstate')return;
  if(a==='ovclose'&&ev.target!==el)return;
  const f=A[a];if(f)f(el.dataset,ev);
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.a==='q'){U.q[el.dataset.k]=el.value;render()}
  else if(el.dataset&&el.dataset.a==='pstate')A.pstate(el.dataset,ev);
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.a==='q'&&el.tagName==='INPUT'&&el.type==='text'||(el.dataset&&el.dataset.a==='q'&&el.tagName==='INPUT'&&!el.type)){U.q[el.dataset.k]=el.value;const pos=el.selectionStart,k=el.dataset.k;render();const n=document.querySelector(`input[data-k="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
  if(el.id==='notes'){D.notas=el.value;persist()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();if(ev.key==='Enter'&&ev.target.id&&(ev.target.id==='pw1'||ev.target.id==='pw2'))arqGo()});
const h0=(location.hash||'').slice(1);if(NAV.some(n=>n[0]===h0)||h0==='papelera')U.view=h0;
render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
