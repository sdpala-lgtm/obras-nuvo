.content{flex:1;overflow:auto;padding:22px 24px 60px}
h1{font-size:28px;margin:0 0 2px}h2{font-size:15px;margin:0}h3{font-size:13px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}

.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--soft);border:1px solid transparent;border-radius:10px;padding:8px 14px}.tab.on{background:var(--ac);color:#14202b;font-weight:600}

.mut{color:var(--mut)}.sm{font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}

.stg{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);text-align:left}.stg.done{background:#13a56a1c;border-color:#13a56a66}.stg.cur{background:#e8a21c26;border-color:var(--ac)}
.cover{height:190px;border-radius:var(--r);background:linear-gradient(120deg,#2a3b4d,#14202b);background-size:cover;background-position:center;position:relative;margin-bottom:14px}

.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dl>div{background:var(--soft);border-radius:12px;padding:10px 12px}.dl label{font-size:11px;color:var(--mut);display:block}.dl b{font-weight:600}

.ev{border-radius:6px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.v{background:#e8a21c40}.ev.k{background:#8a99ab33}.ev.e{background:#14202b;color:#fff}.ev.x{text-decoration:line-through;opacity:.6}
.gantt{overflow:auto}.gr{display:flex;align-items:center;height:42px;position:relative;border-bottom:1px dashed var(--line)}
.gb{position:absolute;height:28px;border-radius:8px;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;white-space:nowrap;font-weight:500;cursor:pointer}
.gb i{position:absolute;left:0;top:0;bottom:0;background:#e8a21c55;border-radius:8px;z-index:0}.gb span{position:relative;z-index:1}
.gh{position:relative;height:26px;border-bottom:1px solid var(--line)}.gh span{position:absolute;font-size:11px;color:var(--mut);border-left:1px solid var(--line);padding-left:4px;height:26px}

.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.f .full{grid-column:1/-1}.f input,.f select,.f textarea{width:100%}

.sbox input{padding-right:46px}

 body.vn aside{display:none}
 body.vn #app{flex-direction:column}

.rdoc{overflow-x:auto}.rdoc td:last-child{white-space:nowrap}

  let loc=null;try{loc=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  const pick=(x,y)=>(x&&(x.savedAt||0)>=((y&&y.savedAt)||0))?x:(y||null);
  return JSON.parse(JSON.stringify({nuvo:pick(loc&&loc.nuvo,SEED.nuvo),arq:pick(loc&&loc.arq,SEED.arq),ts:pick(loc&&loc.ts,SEED.ts)}));
}

/* --- Cifrado del espacio Arq. Paladino (AES-GCM + PBKDF2) --- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encD(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},CK.key,new TextEncoder().encode(JSON.stringify(D)));return {salt:b64(CK.salt),iv:b64(iv),ct:b64(new Uint8Array(ct)),savedAt:D.savedAt||Date.now()}}
async function decBlob(blob,pw){const salt=ub64(blob.salt),key=await deriveKey(pw,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(blob.iv)},key,ub64(blob.ct));return {data:JSON.parse(new TextDecoder().decode(pt)),ck:{key,salt}}}
let saveT=null;
async function flush(){
  try{if(AW==='nuvo')W.nuvo=D;else if(CK)W[AW]=await encD();

}

function vAgenda(){
  const {y,m}=U.cal,mode=U.cal.mode,flt=U.sub.flt||'todo';
  const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));
  const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return iso(d)});
  const inM=d=>d.slice(0,7)===y+'-'+pad(m+1);
  const ev=d=>dayEvents(d).filter(e=>flt==='todo'||(flt==='vis'&&e.k==='v')||(flt==='tar'&&e.k==='k')||(flt==='pro'&&e.k==='e'));
  const mv=live('visitas').filter(v=>inM(v.fecha)),mt=live('tareas').filter(t=>t.vence&&inM(t.vence)),me=live('proyectos').filter(p=>p.entrega&&inM(p.entrega));
  const dp=(a,b)=>`<div class="progress"><div class="prog" style="margin-top:6px"><i style="width:${b?a/b*100:0}%"></i></div></div>`;
  const kp=(l,pend,done,tot,extra)=>`<div class="card" style="padding:14px"><small class="mut">${l}</small><div><span style="font-size:26px;font-weight:600">${pend}</span> pendientes</div>${tot!==undefined?dp(done,tot)+`<small class="mut">${done} completadas de ${tot}</small>`:''}${extra||''}</div>`;
  let body;
  if(mode==='agenda'){
    const list=days.filter(inM).flatMap(d=>ev(d).map(e=>({d,e})));
    body=`<div class="card">${list.map(({d,e})=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer" data-a="evclick" data-c="${e.c}" data-id="${e.id}"><span style="width:90px"><b>${fd(d)}</b></span><span style="flex:1">${esc(e.txt)}<br><small class="mut">${esc(e.sub)}</small></span><span class="pill ${e.k==='v'?'warn':''}">${e.tag}</span></div>`).join('')||'<p class="mut">Sin eventos este mes.</p>'}</div>`;
  }else{
    const ds=mode==='semana'?weekDays(U.wk):days;

  }
  return head('Visitas y Agenda','Visitas de obra, reuniones con clientes, coordinación de proveedores y calendario unificado',`<button class="btn p" data-a="newvis">+ Agendar visita</button><button class="btn" data-a="new" data-c="tareas">+ Nueva tarea</button>`)+
  `<div class="card"><div class="row" style="flex-wrap:wrap;margin-bottom:14px"><h2>Calendario y agenda general</h2><div class="row" style="gap:8px;flex-wrap:wrap"><div class="tabs" style="margin:0">${[['todo','Todo'],['vis','Visitas'],['tar','Tareas'],['pro','Proyectos']].map(([k,l])=>`<button class="tab ${flt===k?'on':''}" data-a="aflt" data-v="${k}">${l}</button>`).join('')}</div><div class="tabs" style="margin:0">${[['semana','Semana'],['mes','Mes'],['agenda','Agenda']].map(([k,l])=>`<button class="tab ${mode===k?'on':''}" data-a="cmode" data-v="${k}">${l}</button>`).join('')}</div><div><button class="btn s" data-a="cm" data-d="-1">‹</button> <button class="btn s" data-a="cm" data-d="0">Hoy</button> <b>${MESES[m][0].toUpperCase()+MESES[m].slice(1)} ${y}</b> <button class="btn s" data-a="cm" data-d="1">›</button></div></div></div>
  <div class="grid g4" style="margin-bottom:14px">${kp('Visitas del mes',mv.filter(v=>v.estado==='Programada').length,mv.filter(v=>v.estado==='Finalizada').length,mv.length)}${kp('Tareas del mes',mt.filter(t=>t.estado!=='Completada').length,mt.filter(t=>t.estado==='Completada').length,mt.length)}${kp('Entregas de proyecto',me.filter(p=>p.estado!=='Finalizado').length,me.filter(p=>p.estado==='Finalizado').length,me.length)}<div class="card" style="padding:14px"><small class="mut">Tareas atrasadas</small><div style="font-size:26px;font-weight:600" class="bad-t">${live('tareas').filter(t=>taskState(t)==='Atrasada').length}</div><small class="mut">Vencidas y sin completar</small></div></div>

/* ============ Formularios CRUD ============ */
function fieldHTML(c,[k,l,t,o,full],v){
  const id='f_'+k;let inp='';
  if(t==='text')inp=`<input id="${id}" value="${esc(v)}">`;
  else if(t==='num')inp=`<input id="${id}" type="number" step="any" value="${esc(v)}">`;
  else if(t==='date')inp=`<input id="${id}" type="date" value="${esc(v)}">`;
  else if(t==='time')inp=`<input id="${id}" type="time" value="${esc(v)}">`;
  else if(t==='area')inp=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
  else if(t==='sel')inp=`<select id="${id}">${o.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else if(t==='list'){const L=S()[o].slice();if(v&&!L.includes(v))L.push(v);inp=`<select id="${id}">${L.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
  else if(t==='mon')inp=`<select id="${id}">${S().monedas.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`;
  else if(t==='etapa')inp=`<select id="${id}">${S().etapas.map((x,i)=>`<option value="${i}" ${+v===i?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else if(t==='ref')inp=`<select id="${id}"><option value="">— Sin asignar —</option>${live(o).filter(x=>!(o==='tareas'&&x.id===window.__fid)).map(x=>`<option value="${x.id}" ${v===x.id?'selected':''}>${esc(o==='proyectos'?x.codigo+' · '+x.nombre:o==='tareas'?nm('proyectos',x.proyectoId)+' · '+x.titulo:x.nombre||x.titulo)}</option>`).join('')}</select>`;
  return `<div class="${full?'full':''}"><label>${l}</label>${inp}</div>`;
}
function openForm(c,id,pf){
  window.__fid=id||'';
  const sch=SCH[c],rec=id?byId(c,id):Object.assign({},DEF[c](),pf||{});
  modal(`<h2>${id?'Editar':'Nuevo'} ${sch.t}</h2><div class="f">${sch.f.map(f=>fieldHTML(c,f,rec[f[0]])).join('')}</div><div class="acts">${id?`<button class="btn d" data-a="del" data-c="${c}" data-id="${id}">Mover a papelera</button>`:''}<button class="btn" data-a="close">Cancelar</button><button class="btn p" data-a="saveform" data-c="${c}" data-id="${id||''}">Guardar</button></div>`);
}
function saveForm(c,id){
  const sch=SCH[c],rec=id?byId(c,id):{id:uid()},prev=id?JSON.parse(JSON.stringify(rec)):null;
  sch.f.forEach(([k,l,t])=>{let v=$('#f_'+k).value;if(t==='num')v=v===''?0:+v;if(t==='etapa')v=+v;rec[k]=v});
  const req=sch.f[1]&&(c==='clientes'||c==='proyectos'||c==='proveedores'||c==='equipo')?'nombre':(sch.f[0][0]==='titulo'||sch.f[0][0]==='concepto')?sch.f[0][0]:null;
  if(req&&!String(rec[req]||'').trim()){toast('Completá el campo obligatorio: '+req);return}
  if(c==='tareas'){
    if(rec.dependeId&&(rec.dependeId===rec.id||hasCycle(rec.id,rec.dependeId))){rec.dependeId='';toast('Esa dependencia generaba un ciclo y se quitó')}
    rec.duracion=Math.max(0,Math.round(+rec.duracion||0));
    if(rec.inicio&&rec.duracion>0){
      if(prev&&rec.vence!==prev.vence&&rec.inicio===prev.inicio&&rec.duracion===prev.duracion&&rec.vence>=rec.inicio)rec.duracion=dDiff(rec.inicio,rec.vence)+1;
      else rec.vence=addDays(rec.inicio,rec.duracion-1);
    }else if(!rec.inicio&&rec.vence&&rec.duracion>0)rec.inicio=addDays(rec.vence,-(rec.duracion-1));
    else if(rec.inicio&&rec.vence&&!rec.duracion&&rec.vence>=rec.inicio)rec.duracion=dDiff(rec.inicio,rec.vence)+1;
  }
  if(!id)D[c].push(rec);
  if(c==='tareas')reschedule();
  if(c==='tareas'&&rec.estado==='Completada')rec.completada=today();
  persist();closeModal();toast('Guardado ✔');render();
}

function parseCSV(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){v+='"';i++}else q=false}else v+=ch}else if(ch==='"')q=true;else if(ch===','||ch===';'){r.push(v);v=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=ch}if(v||r.length){r.push(v);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}

/* ============ Sincronización con Google Sheet (solo app instalada) ============ */
const STANDALONE=!window.claude;
const SYNC_C=['clientes','proyectos','tareas','visitas','proveedores','compras','documentos','movimientos','equipo'];
const LOCAL_ONLY=['logo','portada','foto'];
const SYN={cfg:{},st:{since:0,h:{},arqUp:0,tsUp:0},msg:'',busy:false,t:null};
try{SYN.cfg=JSON.parse(localStorage.getItem('sync_cfg')||'{}');const _s=JSON.parse(localStorage.getItem('sync_st')||'null');if(_s)SYN.st=_s}catch(e){}
const saveSyn=()=>{try{localStorage.setItem('sync_cfg',JSON.stringify(SYN.cfg));localStorage.setItem('sync_st',JSON.stringify(SYN.st))}catch(e){}};
const strip=o=>{const c={};for(const k in o)if(k!=='upd'&&!LOCAL_ONLY.includes(k))c[k]=o[k];return c};
const hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h)+':'+t.length};
const metaOf=N=>({settings:strip(N.settings),notas:N.notas||'',reminders:!!N.reminders});
function syncFlat(N,c,r){
  const o={};
  if(c==='meta'){o['Estudio']=N.settings.estudio;o['Notas']=N.notas||'';return o}
  const nmN=(cc,id)=>{const x=(N[cc]||[]).find(y=>y.id===id);return x?(x.nombre||x.titulo||''):''};
  SCH[c].f.forEach(([k,l,t,x])=>{let v=r[k];if(t==='ref')v=nmN(x,v);else if(t==='etapa')v=(N.settings.etapas[v]||'');o[l]=(v==null?'':v)});
  o['Eliminado']=r.del?'sí':'';return o;
}
const syncCols=()=>{const o={meta:['Estudio','Notas']};SYNC_C.forEach(c=>o[c]=SCH[c].f.map(f=>f[1]).concat(['Eliminado']));return o};
function collectChanges(N){
  const ch=[],h=SYN.st.h,seen={},now=Date.now(),sent={};
  const hasData=['clientes','proyectos','movimientos'].some(c=>(N[c]||[]).length);
  if(SYN.st.since===0&&!hasData)return {ch:[],sent:{}};
  const mk=(c,id,obj,setUpd)=>{
    const key=c+'|'+id;seen[key]=1;const d=strip(obj),js=hsh(JSON.stringify(d));
    if(h[key]===js)return;
    const upd=now;setUpd(upd);ch.push({c,id,upd,data:d,flat:syncFlat(N,c,obj)});sent[key]=js;
  };
  mk('meta','meta',metaOf(N),u=>{N.metaUpd=u});
  SYNC_C.forEach(c=>(N[c]||[]).forEach(r=>mk(c,r.id,r,u=>{r.upd=u})));
  Object.keys(h).forEach(key=>{if(!seen[key]&&key.indexOf('meta|')!==0){const [c,id]=key.split('|');ch.push({c,id,upd:now,data:null,flat:{}});sent[key]=null}});
  return {ch,sent};
}
function applyRemote(N,recs){
  let n=0;const h=SYN.st.h;
  recs.forEach(r=>{
    const key=r.c+'|'+r.id;
    if(r.c==='meta'){if(!r.data)return;const keep={};LOCAL_ONLY.forEach(k=>{if(N.settings[k])keep[k]=N.settings[k]});N.settings=Object.assign({},r.data.settings,keep);N.notas=r.data.notas;N.reminders=r.data.reminders;N.metaUpd=r.upd;h[key]=hsh(JSON.stringify(strip(metaOf(N))));n++;return}
    const arr=N[r.c];if(!arr)return;const i=arr.findIndex(x=>x.id===r.id);
    if(r.data==null){if(i>=0){arr.splice(i,1);n++}delete h[key];return}
    const keep={};if(i>=0)LOCAL_ONLY.forEach(k=>{if(arr[i][k])keep[k]=arr[i][k]});
    const rec=Object.assign({},r.data,keep,{upd:r.upd});
    if(i>=0){if(hsh(JSON.stringify(strip(arr[i])))===h[key]||(arr[i].upd||0)<=r.upd){arr[i]=rec;n++}}else{arr.push(rec);n++}
    h[key]=hsh(JSON.stringify(strip(r.data)));
  });
  return n;
}
function setSynMsg(m){SYN.msg=m;const b=document.querySelector('[data-a=syncnow]');if(b)b.textContent='☁ '+m}
async function syncNow(manual){
  if(!STANDALONE||SYN.busy)return;
  const c=SYN.cfg;if(!c.url||!c.token){if(manual)toast('Primero cargá la dirección y la clave de sincronización');return}
  if(!navigator.onLine){setSynMsg('Sin conexión · pendiente');return}
  SYN.busy=true;setSynMsg('Sincronizando…');
  try{
    const N=ensureD(W.nuvo),{ch,sent}=collectChanges(N);
    const arqUp=W.arq&&(W.arq.savedAt||0)>(SYN.st.arqUp||0)?W.arq.savedAt:0;
    const tsUp=W.ts&&(W.ts.savedAt||0)>(SYN.st.tsUp||0)?W.ts.savedAt:0;

/* --- Vista: nueva (barra inferior + tarjetas) o clásica --- */
const VM=()=>{try{const v=localStorage.getItem('ui_vista');if(v==='nueva'||v==='clasica')return v}catch(e){}return innerWidth<=700?'nueva':'clasica'};
function paintShell(){document.body.classList.toggle('vn',VM()==='nueva');const b=$('#bbar');if(b)b.innerHTML=bbarHTML()}
function bbarHTML(){
  const it=[['dashboard','▦','Inicio'],['proyectos','◎','Obras'],['tareas','☑','Tareas'],['finanzas','$','Caja']];
  return it.map(([k,i,l])=>`<button data-a="go" data-v="${k}" class="${U.view===k?'on':''}"><i>${i}</i>${l}</button>`).join('')+`<button data-a="more"><i>⋯</i>Más</button>`;
}
function mheadHTML(){
  const n=AW==='nuvo'?'Nuvó':PRIV[AW].n;
  return `<div class="mhead"><b>${esc(n)}</b><span class="wsm"><button data-a="ws" data-w="nuvo" class="${AW==='nuvo'?'on':''}">Nuvó</button><button data-a="ws" data-w="arq" class="${AW==='arq'?'on':''}">🔒 DP</button><button data-a="ws" data-w="ts" class="${AW==='ts'?'on':''}">🔒 TS</button></span></div>`;
}
function homeCards(){
  if(VM()!=='nueva')return '';
  const cur=mon(),ft=finTotals(cur),tk=live('tareas'),pend=tk.filter(t=>t.estado!=='Completada').length,atr=tk.filter(t=>taskState(t)==='Atrasada').length;
  const hoy=live('visitas').filter(v=>v.estado==='Programada'&&v.fecha===today()).length;
  const act=live('proyectos').filter(p=>p.estado!=='Finalizado').length;
  const compras=live('compras').filter(c=>c.estado!=='Abonado'&&c.estado!=='En obra / Entregado').length;
  const C=[['proyectos','◎','Obras',act+(act===1?' activa':' activas')],['tareas','☑','Tareas',pend+' pendientes'+(atr?' · '+atr+' atrasadas':'')],['agenda','▤','Visitas y agenda',hoy?hoy+' hoy':'sin visitas hoy'],['finanzas','$','Caja',money(ft.cob,cur)+' cobrado'],['compras','⛁','Compras',compras+' sin cerrar'],['clientes','☺','Clientes',live('clientes').length+' en total'],['documentos','▭','Documentos',live('documentos').length+' cargados'],['reporte','≡','Reporte de obras','estado general']];
  const nuvo=AW==='nuvo';
  const priv=nuvo?`<div class="spc"><span class="sm mut">Espacios privados</span><button class="btn" data-a="ws" data-w="arq">🔒 DP</button><button class="btn" data-a="ws" data-w="ts">🔒 TS</button></div>`:'';
  return `<div class="hhead"><small>${nuvo?'App de gestión de obras':'Espacio privado'}</small><h1>${nuvo?'Nuvó':esc(PRIV[AW].n)}</h1><p class="sub">${nuvo?'Compartido entre Diego y Tomás. Cada socio tiene su espacio privado.':'Solo vos ves este espacio.'}</p></div>${priv}<div class="hcards">${C.map(([k,i,l,s])=>`<button class="hc" data-a="go" data-v="${k}"><i>${i}</i><b>${l}</b><small>${esc(s)}</small></button>`).join('')}</div>`;
}
function moreSheet(){
  const sec=NAV.filter(n=>!['dashboard','proyectos','tareas','finanzas'].includes(n[0]));
  const b=(t,attrs,label,ic)=>`<button class="mb" data-a="mx" data-t="${t}" ${attrs}><i>${ic}</i>${label}</button>`;
  modal(`<h2>Más</h2><h3>Secciones</h3><div class="mgrid">${sec.map(([k,l,i])=>b('go',`data-v="${k}"`,l,i)).join('')}${b('go','data-v="papelera"','Papelera','🗑')}</div>
  <h3 style="margin-top:14px">Espacios</h3><div class="mgrid">${b('ws','data-w="nuvo"','Nuvó','◆')}${b('ws','data-w="arq"','DP','🔒')}${b('ws','data-w="ts"','TS','🔒')}</div>
  <h3 style="margin-top:14px">Ajustes rápidos</h3><div class="mgrid">${b('vista','','Vista: '+(VM()==='nueva'?'nueva':'clásica'),'▦')}${b('theme','',S().tema==='oscuro'?'Tema claro':'Tema oscuro','☾')}${b('rem','','Recordatorios: '+(D.reminders?'Sí':'No'),'⏰')}${b('notif','','Notificaciones','🔔')}${STANDALONE&&SYN.cfg.url?b('syncnow','','Sincronizar','☁'):''}${b('settings','','Configuración','⚙')}${b('help','','Instructivo','?')}${AW!=='nuvo'?b('lock','','Bloquear','🔒')+b('chpw','','Contraseña','🔑'):''}</div>
  <div class="acts"><button class="btn" data-a="close">Cerrar</button></div>`);
}

/* --- Estado de cuenta por obra --- */
const esAdic=m=>m.categoria==='Pago de adicional'||/adicional/i.test(m.concepto||'');
const sumI=a=>a.reduce((s,x)=>s+(+x.importe||0),0);
function cuenta(p){
  const cur=p.moneda||S().principal;
  const pr=live('presupuestos').filter(x=>x.proyectoId===p.id&&x.moneda===cur&&x.estado==='Aprobado');
  const orig=sumI(pr.filter(x=>x.clase==='Presupuesto original')),adic=sumI(pr.filter(x=>x.clase==='Adicional'));
  const base=orig>0?orig:(+p.honorarios||0);

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;let REC=null;
const nz=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s.,]/g,' ').replace(/\s+/g,' ').trim();
const STOPW=new Set(['para','con','que','por','una','uno','los','las','del','mis','tengo','hoy','abrime','mostrame','dame','haceme','hace','quiero','necesito','obra','cliente','proyecto','pagos','pago','cobros','cobro','tareas','tarea','pendientes','pendiente','reporte','estado','cuenta','cargar','registrar','gasto','gastos','pesos','dolares','semana','mes','esta','este','caja','movimientos','saldo','presupuesto','adicional','mil','millones','millon','informe','sobre','todas','todos','ver','las','como','esta']);
function findProj(n){
  const tk=n.split(' ').filter(t=>t.length>2&&!STOPW.has(t)&&!/^\d/.test(t));let best=null;
  live('proyectos').forEach(p=>{const hay=nz(p.nombre+' '+p.codigo+' '+(p.ubicacion||'')+' '+nm('clientes',p.clienteId));const sc=tk.filter(t=>hay.includes(t)).length;if(sc>0&&(!best||sc>best.score))best={p,score:sc}});
  return best;
}
function findCli(n){
  const tk=n.split(' ').filter(t=>t.length>2&&!STOPW.has(t)&&!/^\d/.test(t));let best=null;
  live('clientes').forEach(c=>{const hay=nz(c.nombre);const sc=tk.filter(t=>hay.includes(t)).length;if(sc>0&&(!best||sc>best.score))best={c,score:sc}});
  return best&&best.c;
}
function parseMonto(n){
  const m=/(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?\s*(millones|millon|mil|k)?\b/.exec(n);
  if(m){let v=parseFloat(m[1].replace(/\./g,'')+(m[2]?'.'+m[2]:''));const u=m[3];if(u==='mil'||u==='k')v*=1e3;else if(u)v*=1e6;return v}
  if(/medio millon/.test(n))return 5e5;
  if(/\bun millon\b/.test(n))return 1e6;
  return 0;
}
function runCmd(txt){
  const n=nz(txt),pr=findProj(n),has=r=>r.test(n);
  U.q={};U.cur='';
  if(has(/\b(cargar|cargame|registrar|registra|anotar|anota|asentar|agregar|agrega)\b/)&&has(/\b(pago|cobro|gasto|transferencia|deposito|sena)\b/)){
    openQuick({tipo:has(/\bgasto\b/)?'Gasto':'Ingreso',importe:parseMonto(n)||'',proyectoId:pr?pr.p.id:'',clase:has(/adicional/)?'Adicional':'Presupuesto'});
    return 'Revisá los datos y tocá Guardar';
  }
  if(has(/\b(reporte|informe|estado de cuenta)\b/)&&pr&&!has(/\binterno\b/)){A.repcli({id:pr.p.id});return 'Estado de cuenta de '+pr.p.nombre}
  if(has(/\b(reporte|informe)\b/)&&!pr){go('reporte');return 'Reporte de obras'}
  if(has(/\b(pago|pagos|cobro|cobros|cobrado|ingreso|ingresos|caja|gasto|gastos|movimiento|movimientos|saldo|presupuesto|adicional|adicionales)\b/)){
    if(pr){go('proyectos',{tab:'fin'});U.sel=pr.p.id;render();return 'Caja de '+pr.p.nombre}
    go('finanzas');return 'Finanzas';
  }
  if(has(/\b(tarea|tareas|pendiente|pendientes|vence|vencen|atrasada|atrasadas)\b/)){
    const hoy=has(/\bhoy\b/),per=hoy?'custom':has(/\bsemana\b/)?'sem':has(/\bmes\b/)?'mes':'';
    if(pr)U.q.tk_p=pr.p.id;
    if(per){U.q.tk_per=per;if(hoy){U.q.tk_a='';U.q.tk_b=today()}}
    go('tareas',{f:has(/atrasad/)?'Atrasada':'pend'});
    return 'Tareas'+(pr?' de '+pr.p.nombre:'')+(hoy?' pendientes hasta hoy':per==='sem'?' de esta semana':per==='mes'?' de este mes':'');
  }
  if(has(/\b(visita|visitas|agenda|reunion|reuniones|calendario)\b/)){go('agenda');return 'Visitas y agenda'}
  if(has(/\b(proveedor|proveedores)\b/)){go('proveedores');return 'Proveedores'}
  if(has(/\b(compra|compras|pedido|pedidos)\b/)){go('compras');return 'Compras y pedidos'}
  if(has(/\b(documento|documentos|plano|planos)\b/)){go('documentos');return 'Documentos'}
  if(has(/\b(cliente|clientes)\b/)){const c=findCli(n);if(c){go('clientes');U.sel=c.id;render();return 'Cliente '+c.nombre}go('clientes');return 'Clientes'}
  if(pr){go('proyectos');U.sel=pr.p.id;render();return pr.p.nombre}
  const gs=$('#gs');if(gs){gs.value=txt;gs.dispatchEvent(new Event('input'));gs.focus()}
  return 'No entendí el pedido; busqué “'+txt+'”';
}
